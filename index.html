function tone(c,o,f1,f2,du,ty,v,w){const x=c.createOscillator(),g=c.createGain();x.type=ty;x.frequency.setValueAtTime(f1,w);x.frequency.exponentialRampToValueAtTime(f2,w+du);g.gain.setValueAtTime(v,w);g.gain.exponentialRampToValueAtTime(.001,w+du);x.connect(g);g.connect(o);x.start(w);x.stop(w+du+.05);return x}

function playSfx(c,o,n,w){const v=.4;
 if(n==='pop')tone(c,o,700,200,.12,'sine',v,w);else if(n==='whoosh')noise(c,o,.45,300,3000,v,w);
 else if(n==='coin'){tone(c,o,988,988,.1,'square',v*.4,w);tone(c,o,1319,1319,.3,'square',v*.4,w+.09)}
 else if(n==='stamp'){tone(c,o,140,45,.25,'sine',v*1.4,w);noise(c,o,.12,800,200,v,w)}
 else if(n==='ding')tone(c,o,1320,1300,.9,'sine',v,w);else tone(c,o,900,700,.06,'square',v*.3,w)}
function scheduleAudio(c,out,from,now){const S=[];
 if(A){const s=c.createBufferSource();s.buffer=A.buf;s.connect(out);const L=T.lead,vd=A.ve-A.vs;
  if(from<=L){s.start(now+L-from,A.vs,vd);S.push(s)}else if(from-L<vd){s.start(now,A.vs+from-L,vd-(from-L));S.push(s)}}
 for(const e of T.sfx)if(e.t>=from)playSfx(c,out,e.n,now+e.t-from);
 const mg=c.createGain();mg.gain.value=.1;mg.connect(out);const beat=60/G.music.bpm,CHD=[[0,4,7],[-3,0,4],[-7,-3,0],[-5,-1,2]];

async function pickVideoCfg(W,H,br){

async function pickAudioCfg(kind){

function recMime(kind){
 if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)return null;
 const L=kind==='mp4'?['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4;codecs=h264,aac','video/mp4']

function renderAudioOffline(){
 const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
 const oc=new OAC(2,Math.ceil(T.total*SR),SR);const cp=oc.createDynamicsCompressor();cp.connect(oc.destination);

function peakOf(buf){let pk=0;for(let c=0;c<buf.numberOfChannels;c++){const d=buf.getChannelData(c);for(let i=0;i<d.length;i+=31){const v=Math.abs(d[i]);if(v>pk)pk=v}}return pk}

/* วิธี A: WebCodecs → MP4 (H.264 + AAC) ทีละเฟรม */
async function exportWebCodecs(W,H,br,acfg){
 setP('กำลังเตรียมตัวเข้ารหัส MP4...',0);
 await loadScript('https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.min.js');
 const vcfg=await pickVideoCfg(W,H,br);if(!vcfg)throw new Error('ไม่รองรับ H.264 ขนาดนี้');
 setP('กำลังสร้างเสียง...',0);
 const ab=await renderAudioOffline();
 if(peakOf(ab)<1e-4)throw new Error('เสียงที่สร้างออกมาเงียบ');
 const {Muxer,ArrayBufferTarget}=window.Mp4Muxer,target=new ArrayBufferTarget();
 const muxer=new Muxer({target,video:{codec:'avc',width:W,height:H,frameRate:FPS},audio:{codec:acfg.mux,numberOfChannels:2,sampleRate:SR},fastStart:'in-memory',firstTimestampBehavior:'offset'});
 let encErr=null,aCount=0,vCount=0;
 const ve=new VideoEncoder({output:(c,m)=>{vCount++;muxer.addVideoChunk(c,m)},error:e=>encErr=e});ve.configure(vcfg);
 const ae=new AudioEncoder({output:(c,m)=>{aCount++;muxer.addAudioChunk(c,m)},error:e=>encErr=e});ae.configure(acfg.cfg);
 const N=ab.length,Lc=ab.getChannelData(0),Rc=ab.numberOfChannels>1?ab.getChannelData(1):Lc,BL=4800;
 for(let o=0;o<N;o+=BL){const n=Math.min(BL,N-o),d=new Float32Array(n*2);d.set(Lc.subarray(o,o+n),0);d.set(Rc.subarray(o,o+n),n);
  const ad=new AudioData({format:'f32-planar',sampleRate:SR,numberOfFrames:n,numberOfChannels:2,timestamp:Math.round(o/SR*1e6),data:d});ae.encode(ad);ad.close()}
 await ae.flush();if(encErr)throw encErr;
 if(!aCount)throw new Error('ตัวเข้ารหัสเสียงไม่ส่งข้อมูลออกมา');
 const ec=document.createElement('canvas');ec.width=W;ec.height=H;const eg=ec.getContext('2d');
 const frames=Math.ceil(T.total*FPS),fd=1e6/FPS,t0=performance.now();
 for(let i=0;i<frames;i++){
  if(cancelFlag){try{ve.close();ae.close()}catch(e){}return null}
  if(encErr)throw encErr;
  const t=i/FPS;renderAtTime(eg,t,W/LY.W);
  const vf=new VideoFrame(ec,{timestamp:Math.round(i*fd),duration:Math.round(fd)});
  ve.encode(vf,{keyFrame:i%(FPS*2)===0});vf.close();
  while(ve.encodeQueueSize>6)await sleep(2);
  if(i%8===0){const el=(performance.now()-t0)/1000,eta=i?el/i*(frames-i):0;
   setP(`วิธี: WebCodecs → MP4 ${W}×${H}\n${Math.floor(i/frames*100)}% • ${fmt(t)} / ${fmt(T.total)} • เหลือประมาณ ${Math.ceil(eta)} วิ`,i/frames);await sleep(0)}}
 await ve.flush();if(encErr)throw encErr;if(!vCount)throw new Error('ตัวเข้ารหัสภาพไม่ส่งข้อมูลออกมา');
 ve.close();ae.close();muxer.finalize();

/* วิธี B: MediaRecorder เรียลไทม์ (Safari iOS ได้ MP4/AAC) — เวลาเดินตามนาฬิกาเสียง */
async function exportRecorder(W,H,br,mime){

 if(ac.state!=='running')throw new Error('ระบบเสียงยังไม่ทำงาน — แตะปุ่มสร้างวิดีโออีกครั้ง');

 const dest=ac.createMediaStreamDestination(),og=ac.createGain(),cp=ac.createDynamicsCompressor(),z=ac.createGain();z.gain.value=0;
 og.connect(cp);cp.connect(dest);cp.connect(z);z.connect(ac.destination);

 const at=dest.stream.getAudioTracks();if(!at.length)throw new Error('ไม่พบแทร็กเสียง');

 const head=`วิธี: บันทึกแบบเรียลไทม์ (${mime.split(';')[0]}) ${W}×${H} — เปิดหน้านี้ค้างไว้ ~${Math.ceil(T.total)} วินาที ห้ามสลับแอป`;setP(head,0);
 rec.start(1000);const st0=ac.currentTime+.15,es=scheduleAudio(ac,og,0,st0);
 let lastCT=-1,lastWall=performance.now(),stalled=false;
 await new Promise(res=>{const step=()=>{const ct=ac.currentTime,now=performance.now();
  if(ct!==lastCT){lastCT=ct;lastWall=now}else if(now-lastWall>2000){stalled=true;res();return}
  const t=ct-st0;if(cancelFlag||t>=T.total){res();return}
  renderAtTime(eg,Math.max(0,t),W/LY.W);setP(head+`\n${Math.max(0,Math.floor(t/T.total*100))}% • ${fmt(Math.max(0,t))} / ${fmt(T.total)}`,t/T.total);requestAnimationFrame(step)};step()});
 es.forEach(s=>{try{s.stop()}catch(e){}});await sleep(300);rec.stop();await done;
 try{og.disconnect();cp.disconnect();z.disconnect()}catch(e){}
 stream.getTracks().forEach(t=>t.stop());ec.remove();
 if(stalled)throw new Error('ระบบเสียงหยุดระหว่างบันทึก (อาจล็อกจอหรือสลับแอป) กรุณาลองใหม่');
 if(cancelFlag)return null;

  w.textContent='⚠ เบราว์เซอร์นี้สร้างเสียง AAC ไม่ได้ ไฟล์อาจไม่มีเสียงบน iPhone แนะนำให้สร้างใหม่ด้วย Chrome หรือ Safari รุ่นล่าสุด';res.appendChild(w)}
 const chk=await checkAudio(blob);
 setP(head+'\n'+(chk==null?'ตรวจเสียงอัตโนมัติไม่ได้ ลองกดเล่นวิดีโอด้านล่าง'
  :chk.ok?`✓ ตรวจแล้ว: มีเสียงในไฟล์ (${chk.dur.toFixed(1)} วิ)`
  :'⚠ ตรวจพบว่าไฟล์นี้ไม่มีเสียง กรุณาสร้างใหม่ เปิดหน้านี้ค้างไว้ และอย่าล็อกจอ'),1)}

/* ===== INIT ===== */
['pointerdown','touchend','keydown'].forEach(ev=>document.addEventListener(ev,unlockAC,{passive:true}));
$('file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)loadAudio(f).catch(err=>{$('banner').className='';$('banner').textContent='อ่านไฟล์เสียงไม่ได้: '+(err&&err.message||err)+' (ลองแปลงเป็น mp3 หรือ m4a)'})};
$('pl').onclick=()=>{playing?pause():play()};
$('seek').oninput=e=>seek(e.target.value/1000*T.total);
$('mu').onclick=()=>{initAC();muted=!muted;master.gain.value=muted?0:1;$('mu').textContent=muted?'🔇':'🔊'};
$('fs').onclick=()=>{const s=$('stage');try{(s.requestFullscreen||s.webkitRequestFullscreen).call(s)}catch(e){}};
$('fmt').onchange=e=>setFormat(e.target.value);
$('mk').onclick=exportVideo;$('cancel').onclick=()=>{cancelFlag=true};
$('ahint').hidden=!isIOS;
let saved=null;try{saved=localStorage.getItem('fmt')}catch(e){}
setFormat(saved||'v1080');
G.scenes.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.id;b.onclick=()=>seek(T.sc[i].a+.01);$('scenes').appendChild(b)});
build();
Promise.race([document.fonts.load('700 56px Prompt','ทดสอบ'),new Promise(r=>setTimeout(r,2500))]).catch(()=>{}).then(()=>loop());
</script></body></html>
